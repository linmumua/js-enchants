name: JsEnchants
# TabooLib 生成的 Bukkit 装载器（group 决定重定位包名），业务入口不在 plugin.yml 中声明。
main: com.linmumua.jsenchants.taboolib.platform.BukkitPlugin
version: '${version}'
api-version: '26.3'
authors: [ linmumua ]
description: JS 脚本驱动的自定义附魔框架，支持脚本热重载。
load: POSTWORLD
# PacketEvents 与 CraftEngine 都是可选依赖，只服务各自的脚本能力
# （packet_notice 的 ActionBar 单播、vein_miner 的 CE 自定义方块识别）。
# 写 softdepend 而不是 depend，有两层作用：
#   1) 声明依赖顺序：PacketEvents / CraftEngine 先启用，脚本跑起来时它们的 API 已就绪；
#   2) 声明依赖关系后，服务端才会把 com.github.retrooper.packetevents.* 与
#      net.momirealms.craftengine.* 纳入本插件的类加载器——Rhino 正是用它解析脚本里的
#      Java 类名。缺这一行时脚本里那句 new WrapperPlayServerActionBar(...) 会解析成空的
#      包对象，外部表现就是「游戏里看不到，服务端也没有任何报错」；CE 分支同理，
#      永远判定「不是自定义方块」。
# 未安装这两个插件时插件照常启用，只是脚本会把「不可用」写进日志。
softdepend: [ packetevents, CraftEngine ]
# Folia 支持：所有实体/方块动作都走 RegionTasks（Folia 上是实体/区域/全局区域线程，
# Paper 上退化成主线程），受控爆炸在目标自己的区域线程上读取位置并校验区块所有权，
# 句柄退休与停用竞态由 LifecycleCoordinator 收口。不是仅声明，见 platform/ 与相应测试。
folia-supported: true
commands:
  jse:
    description: JsEnchants 管理命令
    usage: /jse <reload|list|give>
permissions:
  jsenchants.admin:
    description: 允许使用 /jse 管理命令
    default: op
